<style>
:root {
  --bg: #fff7ec; --bg2: #ffeeda; --card: #ffffff; --ink: #3b2f2a; --sub: #8a766b; --line: #f0dcc6;
  --accent: #ff8a5c; --accent2: #2f8fd8; --green: #58b368; --pr: #e0566b; --shadow: 0 4px 14px rgba(150, 100, 60, .12);
  --logo-sub: #7a5640;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1a17; --bg2: #2a231f; --card: #2e2622; --ink: #f4e9df; --sub: #b9a597; --line: #44372f; --accent2: #6cc0ff; --logo-sub: #f0d9c4;
    --shadow: 0 4px 14px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  line-height: 1.6; -webkit-text-size-adjust: 100%;
}
a { color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }

/* 上のあいさつ */
header { text-align: center; padding: 36px 0 18px; }
.icon { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; background: var(--bg2); border: 4px solid var(--card); box-shadow: var(--shadow); }
.icon.empty { display: inline-flex; align-items: center; justify-content: center; font-size: 46px; }
h1 { font-size: 24px; margin: 12px 0 4px; }
.bio { color: var(--sub); margin: 0 auto; max-width: 560px; white-space: pre-wrap; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
.chip { display: inline-block; padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); text-decoration: none; font-size: 13px; font-weight: bold; }

/* タブ */
nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; margin: 0 -16px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; padding: 8px 14px; border-radius: 999px; background: var(--bg2); color: var(--ink); font: inherit; font-size: 14px; font-weight: bold; cursor: pointer; }
.tab.on { background: var(--accent); color: #fff; }

/* 一覧 */
section { margin-top: 26px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
h2 { font-size: 18px; margin: 0; }
.more { border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: bold; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.grid.video { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid.video { grid-template-columns: 1fr 1fr; }
}
.card { position: relative; display: flex; flex-direction: column; background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); text-decoration: none; cursor: pointer; transition: transform .15s; min-width: 0; }
.card:hover { transform: translateY(-2px); }
.thumb { position: relative; aspect-ratio: 1200 / 630; background: var(--bg2); overflow: hidden; }
.video .thumb { aspect-ratio: 9 / 16; }
/* 見えている動画を音なしで再生（画像の上に重ねる。押したときは大きく開く） */
.thumb .live { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; opacity: 0; transition: opacity .5s; background: #000; }
.thumb.playing .live { opacity: 1; }
.thumb.playing .play { opacity: 0; }
.play { transition: opacity .3s; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.play::after { content: "▶"; width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; padding-left: 4px; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.title { font-weight: bold; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.desc { color: var(--sub); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { margin-top: auto; padding-top: 4px; color: var(--sub); font-size: 11px; display: flex; gap: 6px; align-items: center; }
.badge { position: absolute; top: 8px; left: 8px; z-index: 2; background: var(--pr); color: #fff; font-size: 11px; font-weight: bold; padding: 1px 8px; border-radius: 6px; }
.new { background: var(--green); }
.hot { background: #ff7a1a; }
.count { display: inline-block; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 0 6px; font-size: 11px; font-weight: bold; }
.sbtn .count { position: absolute; left: 10px; bottom: -8px; }

/* アンケート */
.poll { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
.poll h2 { margin-bottom: 4px; }
.poll .q { font-weight: bold; margin: 0 0 10px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; margin-bottom: 8px; cursor: pointer; font-size: 15px; }
.opt.on { border-color: var(--accent); background: var(--bg); }
.opt input { accent-color: var(--accent); width: 18px; height: 18px; }
.res { margin-bottom: 8px; }
.res .lab { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 3px; }
.bar { height: 12px; background: var(--bg2); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb27d, var(--accent)); border-radius: 6px; }
.privacy { font-size: 11px; opacity: .8; }

/* 集計（管理者） */
.box.wide { max-width: 760px; }
.periods { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.periods button { border: 0; padding: 7px 12px; border-radius: 999px; background: var(--bg2); color: var(--ink); font: inherit; font-size: 13px; font-weight: bold; cursor: pointer; }
.periods button.on { background: var(--accent); color: #fff; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .nums { grid-template-columns: repeat(2, 1fr); } }
.num { background: var(--bg); border-radius: 12px; padding: 10px; text-align: center; }
.num b { display: block; font-size: 24px; color: var(--accent); line-height: 1.2; }
.num span { font-size: 11px; color: var(--sub); }
.st h4 { margin: 18px 0 8px; font-size: 14px; }
.rank { width: 100%; border-collapse: collapse; font-size: 13px; }
.rank th { text-align: left; color: var(--sub); font-weight: normal; font-size: 11px; padding: 4px; border-bottom: 1px solid var(--line); }
.rank td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.rank td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rank .t { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar { display: grid; grid-template-columns: minmax(80px, 34%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 5px; }
.hbar .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cols { display: flex; align-items: flex-end; gap: 2px; height: 90px; padding-top: 4px; }
.cols div { flex: 1; background: var(--accent2); border-radius: 3px 3px 0 0; min-height: 1px; position: relative; }
.cols-lab { display: flex; justify-content: space-between; font-size: 10px; color: var(--sub); margin-top: 3px; }
.cmt { background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; white-space: pre-wrap; }
.cmt small { color: var(--sub); display: block; }
.sheet-link { display: block; text-align: center; margin-top: 16px; padding: 11px; border-radius: 12px; background: var(--green); color: #fff; font-weight: bold; text-decoration: none; }
body.admin .wrap { padding-bottom: 90px; }

/* 応援ボタン */
.support { display: flex; flex-direction: column; gap: 10px; }
.sbtn { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(135deg, #ffb27d, #ff7f9c); color: #fff; text-decoration: none; box-shadow: var(--shadow); cursor: pointer; }
.sbtn img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,.3); flex: none; }
.sbtn b { display: block; font-size: 15px; }
.sbtn span { font-size: 12px; opacity: .95; }

.empty-msg { text-align: center; color: var(--sub); padding: 40px 0; font-size: 14px; }
footer { margin-top: 44px; text-align: center; color: var(--sub); font-size: 12px; }
footer p { margin: 4px 0; }
.admin-link { border: 0; background: none; color: var(--sub); opacity: .5; font-size: 16px; cursor: pointer; margin-top: 8px; }

/* 管理者 */
.abar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 20; display: flex; gap: 6px; background: var(--ink); padding: 6px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
.abar button { border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: bold; cursor: pointer; background: var(--bg); color: var(--ink); white-space: nowrap; }
.abar .main { background: var(--accent); color: #fff; }
.tools { position: absolute; top: 6px; right: 6px; z-index: 3; display: flex; gap: 4px; }
.tools button { border: 0; width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer; font-size: 14px; padding: 0; color: #333; }

.modal { position: fixed; inset: 0; z-index: 30; background: rgba(30, 20, 15, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.box { background: var(--card); color: var(--ink); border-radius: 18px; width: 100%; max-width: 460px; max-height: calc(100vh - 32px); overflow: auto; padding: 18px; }
.box h3 { margin: 0 0 12px; font-size: 17px; }
label { display: block; font-size: 12px; font-weight: bold; color: var(--sub); margin: 10px 0 4px; }
input[type=text], input[type=password], input[type=url], textarea, select {
  width: 100%; font: inherit; font-size: 16px; padding: 9px 11px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
}
textarea { min-height: 70px; resize: vertical; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); font-weight: normal; }
.hint { font-size: 12px; color: var(--sub); margin: 4px 0 0; }
.row { display: flex; gap: 8px; margin-top: 16px; }
.row button, .btn { flex: 1; border: 0; padding: 11px; border-radius: 12px; font: inherit; font-weight: bold; cursor: pointer; background: var(--bg2); color: var(--ink); }
.row .go, .btn.go { background: var(--accent); color: #fff; }
.btn:disabled, .row button:disabled { opacity: .5; cursor: default; }
.pv { margin-top: 10px; border-radius: 12px; overflow: hidden; background: var(--bg2); max-height: 180px; }
.pv img { width: 100%; display: block; max-height: 180px; object-fit: cover; }
.err { color: var(--pr); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }

.player iframe { width: 100%; height: calc(100% - 36px); border: 0; display: block; }
.tt-open { display: block; height: 36px; line-height: 36px; text-align: center; color: #fff; font-size: 13px; font-weight: bold; text-decoration: none; background: #111; }

/* 画像をえらぶ */
.pick { margin-top: 4px; }
.pick .pv { position: relative; max-height: none; margin-top: 0; aspect-ratio: 1200 / 630; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 13px; border: 2px dashed var(--line); }
.pick .pv.has { border-style: solid; }
.pick .pv.r34 { aspect-ratio: 9 / 16; max-width: 220px; margin: 0 auto; }
.pick .pv.r11 { aspect-ratio: 1; max-width: 160px; margin: 0 auto; }
.pick .pv.round { border-radius: 50%; }
.pick .pv img { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; object-fit: cover; }
.pick .row { margin-top: 8px; }
.pick input[type=file] { display: none; }
.close { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); font-size: 20px; cursor: pointer; }

/* ロゴ（横長。スマホの横はばに合わせて小さくなる） */
.logo { display: block; width: min(520px, 100%); height: auto; margin: 0 auto; }
.logo text { font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif; font-weight: 800; }
.logo .sub { fill: var(--logo-sub); }
h1.logo-h { margin: 0; line-height: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 「あなたのゲームを載せませんか？」 */
.cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; border: 0; padding: 11px 20px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff;
  background: linear-gradient(135deg, #5cb8ff, #8f7bff); box-shadow: var(--shadow); }
.cta-box { margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); text-align: center; }
.cta-box p { margin: 0; font-size: 13px; color: var(--sub); }
.cta-box .cta { margin-top: 10px; }
.note-line { font-size: 12px; color: var(--sub); margin: 8px 2px 0; }

/* みんなのゲーム：作者 */

.author.plain { color: var(--sub); text-decoration: none; cursor: default; }
.badge.cm { background: #8f7bff; }

/* 申請フォーム・決まり */
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.req { color: var(--pr); }
.rules h4 { margin: 14px 0 6px; font-size: 14px; }
.rules ul { margin: 0; padding-left: 1.3em; font-size: 14px; }
.rules li { margin: 3px 0; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent2); font: inherit; text-decoration: underline; cursor: pointer; }
.done { text-align: center; padding: 10px 0; }
.done .big { font-size: 46px; }

/* 管理者：申請の一覧 */
.abar .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--pr); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.sub-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.sub-tabs button { border: 0; padding: 6px 12px; border-radius: 999px; background: var(--bg2); color: var(--ink); font: inherit; font-size: 13px; font-weight: bold; cursor: pointer; }
.sub-tabs button.on { background: var(--accent); color: #fff; }
.subm { border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.subm.wait { border-color: var(--accent); }
.subm img { width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; border-radius: 10px; background: var(--bg2); display: block; margin-bottom: 8px; }
.subm h4 { margin: 0 0 4px; font-size: 15px; word-break: break-all; }
.subm .kv { font-size: 13px; margin: 2px 0; word-break: break-all; }
.subm .kv span { color: var(--sub); }
.subm .st { display: inline-block; font-size: 11px; font-weight: bold; padding: 1px 8px; border-radius: 6px; color: #fff; background: var(--sub); }
.subm .st.wait { background: var(--accent); } .subm .st.ok { background: var(--green); } .subm .st.no { background: var(--pr); }
.subm .row { margin-top: 10px; }
.subm .row button { padding: 9px 6px; font-size: 13px; }
.subm .ok-btn { background: var(--green); color: #fff; }

/* 管理者のバー：スマホでははみ出さないように横にすべらせる */
.abar { overflow-x: auto; scrollbar-width: none; }
.abar::-webkit-scrollbar { display: none; }
@media (max-width: 420px) { .abar { gap: 4px; padding: 5px; } .abar button { padding: 8px 7px; font-size: 12px; } }

.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); }
.toast[hidden] { display: none; }
.loading { text-align: center; color: var(--sub); padding: 60px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <nav><div class="tabs" id="tabs"></div></nav>
  <main id="main"><div class="loading">🌱 よみこみ中…</div></main>
  <footer id="foot"></footer>
</div>

<div class="modal" id="modal" hidden><div class="box" id="box"></div></div>
<div class="modal" id="vmodal" hidden><button class="close" id="vclose" aria-label="とじる">✕</button><div class="player" id="player"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
// ============================================================================
// 作品のまとめページ。一覧は GAS（ポータル.js）から読む
//   API：まとめページ専用の GAS の公開URL。パソコンの確認用サーバーでは /portal-api
// ============================================================================
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '/portal-api'
  : 'https://script.google.com/macros/s/AKfycbyxp1bGOGkzylwYM7Zwd9NS0U9W_OWvCkGL0ZzGxSKAhx8a20NgFvGe0qSLfSgX6jqQsw/exec';

const SITE_NAME = 'ハムチーズのゲームセンター';
// community：みんなのゲーム（ほかの人の作品。申請 → 管理者が許可 → ここに出る）。自分の作品（ゲーム・動画・note）より後ろ
const KINDS = {
  game:      { tab: '🎮 ハムチーズのゲーム', head: '🎮 ハムチーズのゲーム', ph: '🎮' },
  video:     { tab: '🎬 動画',     head: '🎬 動画',          ph: '🎬' },
  note:      { tab: '📝 note',     head: '📝 note の記事',   ph: '📝' },
  community: { tab: '🕹️ みんなのゲーム', head: '🕹️ みんなのゲーム', ph: '🕹️' },
  pr:        { tab: '🛍️ おすすめ', head: '🛍️ おすすめ（PR）', ph: '🛍️' },
  support:   { tab: '💝 ハムチーズを応援', head: '💝 ハムチーズを応援する', ph: '💝' },
  other:     { tab: '🔗 そのほか', head: '🔗 そのほか',      ph: '🔗' }
};
const ORDER = ['game', 'video', 'note', 'community', 'pr', 'support', 'other'];

// 横長のロゴ（マーク＋文字）。tools/brand.html と同じ絵
const LOGO_SVG = '<svg class="logo" viewBox="0 0 520 130" role="img" aria-label="' + SITE_NAME + '">' +
  '<g transform="translate(0 2) scale(1.0333)">' +
  '<path d="M44 42 L76 42 L76 32 L52 24 Z" fill="#ffd23f" stroke="#3b2f2a" stroke-width="5" stroke-linejoin="round"/>' +
  '<circle cx="62" cy="34" r="2.6" fill="#e9a800"/><circle cx="70" cy="37" r="1.8" fill="#e9a800"/>' +
  '<path d="M30 42 h60 a26 26 0 0 1 26 26 v8 a20 20 0 0 1 -36 12 l-6 -8 h-28 l-6 8 a20 20 0 0 1 -36 -12 v-8 a26 26 0 0 1 26 -26 z" fill="#ff8a5c" stroke="#3b2f2a" stroke-width="5" stroke-linejoin="round"/>' +
  '<rect x="25" y="52" width="12" height="24" rx="3" fill="#fff"/><rect x="19" y="58" width="24" height="12" rx="3" fill="#fff"/>' +
  '<circle cx="88" cy="58" r="6.5" fill="#ffd23f" stroke="#3b2f2a" stroke-width="3"/><circle cx="100" cy="69" r="6.5" fill="#5cb8ff" stroke="#3b2f2a" stroke-width="3"/>' +
  '<circle cx="53" cy="59" r="3.2" fill="#3b2f2a"/><circle cx="67" cy="59" r="3.2" fill="#3b2f2a"/>' +
  '<path d="M54 66 q6 6 12 0" fill="none" stroke="#3b2f2a" stroke-width="3.4" stroke-linecap="round"/>' +
  '<circle cx="46" cy="66" r="3" fill="#ff5a7a" opacity=".55"/><circle cx="74" cy="66" r="3" fill="#ff5a7a" opacity=".55"/>' +
  '<path d="M104 14 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#ffd23f" stroke="#3b2f2a" stroke-width="2.5" stroke-linejoin="round"/>' +
  '<path d="M14 22 l2 4.5 4.5 2 -4.5 2 -2 4.5 -2 -4.5 -4.5 -2 4.5 -2 z" fill="#5cb8ff"/></g>' +
  '<text class="sub" x="130" y="52" font-size="27" textLength="160" lengthAdjust="spacingAndGlyphs">ハムチーズの</text>' +
  '<text x="126" y="110" font-size="54" stroke="#3b2f2a" stroke-width="10" stroke-linejoin="round" paint-order="stroke" textLength="388" lengthAdjust="spacingAndGlyphs">' +
  '<tspan fill="#ff8a5c">ゲ</tspan><tspan fill="#ffd23f">ー</tspan><tspan fill="#ff7f9c">ム</tspan><tspan fill="#5cb8ff">セ</tspan><tspan fill="#58b368">ン</tspan><tspan fill="#ffb02e">タ</tspan><tspan fill="#ff8a5c">ー</tspan></text></svg>';
const PER_SECTION = 6;

let DATA = { settings: {}, items: [], notes: [] };
let TAB = 'all';
let CODE = '';
try { CODE = sessionStorage.getItem('portal_code') || ''; } catch (e) {}
try { TAB = localStorage.getItem('portal_tab') || 'all'; } catch (e) {}

const $ = id => document.getElementById(id);
function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'text') e.textContent = v;
    else if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(kids || [])) if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}
const safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
// 画像：URL か、写真を小さくしたもの（data:image/…）
const safeImg = u => /^data:image\/(jpeg|png|webp);base64,/i.test(String(u || '')) ? String(u) : safeUrl(u);
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };

async function call(fn, ...args) {
  // GAS は目ざめるのに時間がかかることがあるので 30秒まで待つ
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  let j;
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), signal: ctl.signal });
    j = await res.json();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'サーバーから返事がありません' : 'サーバーにつながりません');
  } finally { clearTimeout(timer); }
  if (!j.ok) throw new Error(j.error === '呼べない名前です' ? 'サーバー（GAS）がまだ新しい版になっていません' : (j.error || 'うまくいきませんでした'));
  return j.r;
}

// ---------------------------------------------------------------- 📊 集計のための記録
//   見た・押した・動画・タブ・上のリンクを、少しためてから GAS に送る（portalTrack）
//   訪問者ID は端末ごとのでたらめな文字。名前など個人がわかる情報は送らない。管理者の端末は数えない
let VID = '', IS_NEW = false;
try { VID = localStorage.getItem('portal_vid') || ''; } catch (e) {}
if (!VID) {
  VID = (Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 20);
  IS_NEW = true;
  try { localStorage.setItem('portal_vid', VID); } catch (e) {}
}
function trackOff() {
  if (CODE || /[?&]admin\b/.test(location.search)) return true;
  try { return localStorage.getItem('portal_notrack') === '1'; } catch (e) { return false; }
}
const REF_NAMES = { 't.co': 'X', 'x.com': 'X', 'twitter.com': 'X', 'l.facebook.com': 'Facebook', 'lm.facebook.com': 'Facebook', 'm.facebook.com': 'Facebook',
  'l.instagram.com': 'Instagram', 'instagram.com': 'Instagram', 'tiktok.com': 'TikTok', 'note.com': 'note', 'line.me': 'LINE', 'threads.net': 'Threads', 'l.threads.net': 'Threads',
  'google.com': 'Google検索', 'google.co.jp': 'Google検索', 'search.yahoo.co.jp': 'Yahoo!検索', 'bing.com': 'Bing検索', 'youtube.com': 'YouTube', 'hamcheese-jp.github.io': '自分のゲームから' };
function trackMeta() {
  const ua = navigator.userAgent || '';
  const app = /Line\//.test(ua) ? 'LINE' : /Instagram/.test(ua) ? 'Instagram' : /FBAN|FBAV/.test(ua) ? 'Facebook' : /TikTok|musical_ly|Bytedance/i.test(ua) ? 'TikTok' : /Twitter/i.test(ua) ? 'X' : '';
  const dev = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone'
    : /Android/.test(ua) ? (/Mobile/.test(ua) ? 'Android' : 'Androidタブレット') : 'パソコン';
  const q = new URLSearchParams(location.search);
  let ref = q.get('utm_source') || q.get('from') || '';
  if (!ref && document.referrer) {
    try {
      const h = new URL(document.referrer).hostname.replace(/^www\./, '');
      if (h !== location.hostname) ref = REF_NAMES[h] || REF_NAMES[h.split('.').slice(-2).join('.')] || h;
    } catch (e) {}
  }
  if (!ref && app) ref = app;
  return { ref, dev, app, isNew: IS_NEW };
}
const META = trackMeta();
const TQ = [];
let tqTimer = 0;
function track(e, it, tab) {
  if (trackOff()) return;
  // みんなのゲームは作者名も題名に入れておく（集計で「だれの作品が何回押されたか」がわかるように）
  const title = it ? (it.kind === 'community' && it.author && it.title ? it.title + '（作：' + it.author + '）' : it.title || '') : '';
  TQ.push({ e, id: (it && it.id) || '', title, kind: (it && it.kind) || '', tab: tab || TAB });
  clearTimeout(tqTimer);
  tqTimer = setTimeout(() => flushTrack(false), 3000);
}
function flushTrack(leaving) {
  if (!TQ.length) return;
  const body = JSON.stringify({ fn: 'portalTrack', args: [VID, TQ.splice(0, 40), META] });
  if (leaving && navigator.sendBeacon) {
    try { if (navigator.sendBeacon(API, new Blob([body], { type: 'text/plain;charset=utf-8' }))) return; } catch (e) {}
  }
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, keepalive: true }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushTrack(true); });
addEventListener('pagehide', () => flushTrack(true));

let toastT = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}

// ---------------------------------------------------------------- 読みこみ
async function load(fresh) {
  if (!fresh) {
    try { const c = JSON.parse(localStorage.getItem('portal_cache') || 'null'); if (c) { DATA = c; render(); } } catch (e) {}
  }
  try {
    DATA = await call('portalList');
    // 🔥人気とアンケート（集計.js。まだ GAS に入っていなければ何も出さない）
    call('portalExtras').then(x => { DATA.popular = x.popular || []; DATA.poll = x.poll || null; render(); }).catch(() => {});
    try { localStorage.setItem('portal_cache', JSON.stringify(DATA)); } catch (e) {}
    render();
    setupAds();
  } catch (e) {
    if (!DATA.at) {
      $('main').innerHTML = '';
      $('main').appendChild(el('div', { class: 'empty-msg' }, ['よみこめませんでした（' + e.message + '）', el('br'),
        el('button', { class: 'btn go', style: 'margin-top:12px;max-width:200px', text: 'もう一度', onclick: () => { $('main').innerHTML = '<div class="loading">🌱 よみこみ中…</div>'; load(true); } })]));
    }
  }
}

// 種類ごとのならび。note は自動で取った記事と手で足した記事をまとめて新しい順
function listOf(kind) {
  const own = DATA.items.filter(it => it.kind === kind);
  if (kind !== 'note') return own;
  const seen = new Set(own.map(it => it.url));
  return own.concat((DATA.notes || []).filter(n => !seen.has(n.url))).sort((a, b) => (b.added || 0) - (a.added || 0));
}

// ---------------------------------------------------------------- 画面
function render() {
  const s = DATA.settings || {};
  const name = SITE_NAME;
  document.title = name;

  // 上：ロゴ・ひとこと・リンク・「あなたのゲームを載せませんか？」
  const head = $('head'); head.innerHTML = '';
  const h1 = el('h1', { class: 'logo-h' }); h1.innerHTML = LOGO_SVG;
  head.appendChild(h1);
  head.appendChild(el('p', { class: 'bio', text: s.bio || 'ハムチーズの作ったゲームと、みんなが作ったゲームで遊べるゲームセンターです' }));
  if ((s.links || []).length) head.appendChild(el('div', { class: 'chips' }, s.links.map(l => el('a', { class: 'chip', href: l.url, target: '_blank', rel: 'noopener', text: l.label, onclick: () => track('link', { id: 'link:' + l.label, title: l.label, kind: 'link' }) }))));
  head.appendChild(ctaBtn());

  // タブ（中身がある種類だけ。みんなのゲームは まだなくても出す：申請してもらうため）
  const kinds = ORDER.filter(k => k === 'community' || listOf(k).length);
  if (TAB !== 'all' && !kinds.includes(TAB)) TAB = 'all';
  const tabs = $('tabs'); tabs.innerHTML = '';
  [['all', '✨ すべて']].concat(kinds.map(k => [k, KINDS[k].tab])).forEach(([k, label]) => {
    tabs.appendChild(el('button', { class: 'tab' + (TAB === k ? ' on' : ''), text: label, onclick: () => setTab(k) }));
  });

  // 一覧
  stopLive(); SEEN.clear();
  const main = $('main'); main.innerHTML = '';
  if (!kinds.length) {
    main.appendChild(el('div', { class: 'empty-msg', text: CODE ? '下の「＋ 追加」から、URLを貼って登録できます' : 'まだ何もありません' }));
  }
  const show = TAB === 'all' ? kinds : [TAB];
  for (const k of show) {
    const list = listOf(k);
    const cut = TAB === 'all' && list.length > PER_SECTION;
    const sec = el('section');
    sec.appendChild(el('div', { class: 'sec-head' }, [
      el('h2', { text: KINDS[k].head }),
      cut ? el('button', { class: 'more', text: 'もっと見る（' + list.length + '）›', onclick: () => setTab(k) }) : null
    ]));
    const shown = cut ? list.slice(0, PER_SECTION) : list;
    if (k === 'support') {
      sec.appendChild(el('div', { class: 'support' }, shown.map(supportBtn)));
      sec.appendChild(el('p', { class: 'note-line', text: '※ ここからの応援・寄付は、このページを作っている「ハムチーズ」に届きます。「みんなのゲーム」の作者さんには届きません。' }));
    } else if (shown.length) sec.appendChild(el('div', { class: 'grid' + (k === 'video' ? ' video' : '') }, shown.map(card)));
    if (k === 'community') {
      if (list.length) sec.appendChild(el('p', { class: 'note-line', text: '※ みんなのゲームは、それぞれの作者さんの作品です。遊ぶときは、リンク先のページの決まりにしたがってください。' }));
      sec.appendChild(el('div', { class: 'cta-box' }, [
        el('p', { text: list.length ? 'あなたが作ったゲームも、ここに載せられます' : 'まだありません。あなたが作ったゲームを、最初の1本として載せませんか？' }),
        ctaBtn()
      ]));
    }
    main.appendChild(sec);
  }
  if (DATA.poll && TAB === 'all') main.appendChild(pollBox(DATA.poll));

  // 下
  const foot = $('foot'); foot.innerHTML = '';
  if (DATA.items.some(it => it.pr)) foot.appendChild(el('p', { text: '※「PR」がついたリンクは広告（アフィリエイト）です。リンク先で買い物をすると、このページの作者に紹介料が入ることがあります。' }));
  foot.appendChild(el('p', { class: 'privacy', text: 'よりよいページづくりのため、このページが見られた回数や押されたリンクを数えています（名前など、個人がわかる情報は集めていません）。' }));
  foot.appendChild(el('p', { class: 'privacy', text: 'ゲームの申請でいただいた連絡先などの個人情報は、このページには出しません（管理者だけが見ます）。ページに出るのは、ゲームの名前・説明・画像・作者名・作者のSNSだけです。' }));
  foot.appendChild(el('p', {}, [el('button', { class: 'linkish', text: '📜 ゲームを載せるときの決まり', onclick: () => openRules() })]));
  foot.appendChild(el('p', { text: '© ' + new Date().getFullYear() + ' ' + name }));
  if (!CODE) foot.appendChild(el('button', { class: 'admin-link', title: '管理者', text: '🛠️', onclick: openLogin }));

  renderAdminBar();
}

function setTab(k) {
  if (k !== TAB) track('tab', null, k);
  TAB = k;
  try { localStorage.setItem('portal_tab', k); } catch (e) {}
  render();
  window.scrollTo({ top: Math.min(window.scrollY, $('tabs').parentNode.offsetTop), behavior: 'smooth' });
}

const DAY = 86400000;
function card(it) {
  const img = safeImg(it.image);
  const isNew = it.added && Date.now() - it.added < 14 * DAY;
  const thumb = el('div', { class: 'thumb' }, [
    img ? el('img', { src: img, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer', onerror: e => { e.target.replaceWith(el('div', { class: 'ph', text: KINDS[it.kind].ph })); } })
        : el('div', { class: 'ph', text: (KINDS[it.kind] || KINDS.other).ph }),
    it.kind === 'video' ? el('div', { class: 'play' }) : null
  ]);
  if (it.kind === 'video' && tiktokId(it)) { thumb.dataset.vid = tiktokId(it); LIVE.observe(thumb); }
  const date = it.kind === 'note' && it.added ? new Date(it.added).toLocaleDateString('ja-JP') : '';
  const c = el('a', { class: 'card', href: it.url, target: '_blank', rel: it.pr ? 'noopener sponsored' : 'noopener' }, [
    it.pr ? el('span', { class: 'badge', text: 'PR' })
      : (DATA.popular || []).includes(it.id) ? el('span', { class: 'badge hot', text: '🔥 人気' })
      : isNew ? el('span', { class: 'badge new', text: 'NEW' }) : null,
    thumb,
    el('div', { class: 'body' }, [
      el('div', { class: 'title', text: it.title }),
      it.kind === 'community' && it.author ? authorLink(it) : null,
      it.desc ? el('div', { class: 'desc', text: it.desc }) : null,
      el('div', { class: 'meta' }, [[date, host(it.url)].filter(Boolean).join(' ・ '), clickCount(it)])
    ])
  ]);
  if (it.kind === 'video' && tiktokId(it)) c.addEventListener('click', e => { e.preventDefault(); track('video', it); openVideo(it); });
  else c.addEventListener('click', () => track('click', it));
  if (CODE && !it.auto) c.appendChild(adminTools(it));
  return c;
}

// みんなのゲームの作者：作者のSNSへ（カード全体がリンクなので、ここは押したら別に開く）
function authorLink(it) {
  const url = safeUrl(it.authorUrl);
  if (!url) return el('span', { class: 'author plain', text: '作：' + it.author });
  const open = e => {
    e.preventDefault(); e.stopPropagation();
    track('link', { id: 'author:' + it.id, title: it.author + '（作者のSNS）', kind: 'community' });
    window.open(url, '_blank', 'noopener');
  };
  return el('span', { class: 'author', role: 'link', tabindex: '0', title: url, text: '作：' + it.author + ' ↗', onclick: open,
    onkeydown: e => { if (e.key === 'Enter') open(e); } });
}

// 「🎮 あなたのゲームを載せませんか？」
function ctaBtn() { return el('button', { class: 'cta', text: '🎮 あなたのゲームを載せませんか？', onclick: () => openSubmit() }); }

function supportBtn(it) {
  const img = safeImg(it.image);
  const b = el('a', { class: 'sbtn', href: it.url, target: '_blank', rel: 'noopener' }, [
    img ? el('img', { src: img, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }) : null,
    el('div', {}, [el('b', { text: it.title }), it.desc ? el('span', { text: it.desc }) : null]),
    clickCount(it)
  ]);
  b.addEventListener('click', () => track('click', it));
  if (CODE) b.appendChild(adminTools(it));
  return b;
}

// 管理者のときだけ：この30日で押された回数
let STATS30 = null;
function clickCount(it) {
  if (!CODE || !STATS30) return null;
  const s = STATS30.items.find(x => x.id === it.id);
  const n = s ? s.clicks + s.video : 0;
  return el('span', { class: 'count', title: 'この30日で押された回数', text: '👆' + n });
}
async function loadStats30() {
  try { STATS30 = await call('portalStats', CODE, 30); render(); } catch (e) {}
}

// ---------------------------------------------------------------- 🗳️ アンケート（見る人向け。答えたあとは割合を見せる）
function pollVoted(id) { try { return localStorage.getItem('portal_voted_' + id) === '1'; } catch (e) { return false; } }
function pollBox(p) {
  const sec = el('section', { class: 'poll' }, [el('h2', { text: '🗳️ アンケート' }), el('p', { class: 'q', text: p.q })]);
  if (pollVoted(p.id)) {
    p.opts.forEach((o, i) => sec.appendChild(el('div', { class: 'res' }, [
      el('div', { class: 'lab' }, [el('span', { text: o }), el('b', { text: (p.pct[i] || 0) + '%' })]),
      el('div', { class: 'bar' }, [el('i', { style: 'width:' + (p.pct[i] || 0) + '%' })])
    ])));
    sec.appendChild(el('p', { class: 'hint', text: 'ありがとうございました！（' + p.total + '人が答えました）' }));

// ---------------------------------------------------------------- 見えている動画を1本だけ音なしで再生
//   画面のまん中にいちばん近い動画を、少し止まってから再生。ほかは止める（スマホが重くならないように）
const QUIET = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || (navigator.connection && navigator.connection.saveData);
const SEEN = new Map();
let liveThumb = null, liveTimer = 0;
const LIVE = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
  for (const e of es) { if (e.isIntersecting && e.intersectionRatio >= 0.6) SEEN.set(e.target, true); else SEEN.delete(e.target); }
  pickLive();
}, { threshold: [0, 0.6, 1] }) : { observe() {} };

function pickLive() {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => {
    let best = null, bestD = 1e9;
    if (!QUIET && !document.hidden && $('vmodal').hidden) {
      const mid = innerHeight / 2;
      for (const t of SEEN.keys()) {
        if (!t.isConnected) { SEEN.delete(t); continue; }
        const r = t.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid);
        if (d < bestD) { bestD = d; best = t; }
      }
    }
    if (best === liveThumb) return;
    stopLive();
    if (best) startLive(best);
  }, 700);
}
function startLive(t) {
  liveThumb = t;
  const f = el('iframe', { class: 'live', title: '動画', tabindex: '-1', allow: 'autoplay; encrypted-media',
    src: 'https://www.tiktok.com/player/v1/' + encodeURIComponent(t.dataset.vid) +
      '?autoplay=1&muted=1&loop=1&controls=0&progress_bar=0&play_button=0&volume_control=0&fullscreen_button=0&timestamp=0&music_info=0&description=0&rel=0&native_context_menu=0&closed_caption=0' });
  f.addEventListener('load', () => {
    // 音を消して再生（TikTok の再生画面へのお願い。聞いてもらえないときは何もおきない）
    for (const type of ['mute', 'play']) { try { f.contentWindow.postMessage({ type, 'x-tiktok-player': true }, '*'); } catch (e) {} }
    setTimeout(() => { if (liveThumb === t) t.classList.add('playing'); }, 600);
  });
  t.appendChild(f);
}
function stopLive() {
  if (!liveThumb) return;
  liveThumb.classList.remove('playing');
  const f = liveThumb.querySelector('.live');
  if (f) f.remove();
  liveThumb = null;
}
addEventListener('scroll', pickLive, { passive: true });
document.addEventListener('visibilitychange', pickLive);

}

// ---------------------------------------------------------------- 画像をえらぶ（写真・貼りつけ）
// 画像は URL ではなく、ブラウザで小さくしてから保存する（スプレッドシートの1マスに入る大きさ）
let PASTE = null; // 開いている画面の「貼りつけたときにすること」
document.addEventListener('paste', e => {
  if (!PASTE || $('modal').hidden) return;
  const file = [...((e.clipboardData && e.clipboardData.items) || [])].find(i => i.kind === 'file' && /^image\//.test(i.type));
  if (!file) return; // 文字の貼りつけはそのまま
  e.preventDefault();
  PASTE(file.getAsFile());
});

function loadImage(src) {
  return new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ng(new Error('画像を開けませんでした')); im.src = src; });
}
// 画像を小さくして JPEG の data URL に。square：まん中を正方形に切りぬく（アイコン）
async function shrinkImage(src, { max = 640, square = false, limit = 45000 } = {}) {
  const im = await loadImage(src);
  let sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0;
  if (!sw || !sh) throw new Error('画像を開けませんでした');
  if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
  let scale = Math.min(1, max / Math.max(sw, sh));
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  for (let tries = 0; tries < 8; tries++) {
    cv.width = Math.max(1, Math.round(sw * scale)); cv.height = Math.max(1, Math.round(sh * scale));
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); // すきとおったところは白に
    g.imageSmoothingQuality = 'high';
    g.drawImage(im, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    for (const q of [0.85, 0.75, 0.65, 0.55, 0.45]) {
      const url = cv.toDataURL('image/jpeg', q);
      if (url.length <= limit) return url;
    }
    scale *= 0.8;
  }
  throw new Error('画像を小さくできませんでした');
}
const readFile = f => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ng(new Error('ファイルを読めませんでした')); r.readAsDataURL(f); });

// 「📷 写真から選ぶ」・貼りつけ・見本・「消す」。shape：'wide'（ふつうのカード）・'r34'（動画）・'r11'・'round'（アイコン）
function imagePicker(initial, opt) {
  opt = opt || {};
  let value = safeImg(initial) || '';
  let shape = opt.shape || 'wide';
  const pv = el('div', { class: 'pv' });
  const err = el('div', { class: 'err' });
  const file = el('input', { type: 'file', accept: 'image/*' });
  const clear = el('button', { text: '🗑️ 画像を消す', onclick: () => { value = ''; show(); } });
  const show = () => {
    pv.className = 'pv' + (value ? ' has' : '') + (shape === 'r34' ? ' r34' : shape === 'r11' || shape === 'round' ? ' r11' : '') + (shape === 'round' ? ' round' : '');
    pv.innerHTML = '';
    if (value) pv.appendChild(el('img', { src: value, alt: '', referrerpolicy: 'no-referrer' }));
    else pv.appendChild(el('span', { text: '画像なし' }));
    clear.hidden = !value;
  };
  const take = async (src) => {
    err.textContent = ''; pv.innerHTML = ''; pv.appendChild(el('span', { text: '小さくしています…' }));
    try { value = await shrinkImage(src, opt.square ? { max: 160, square: true, limit: 30000 } : { max: 640, limit: 45000 }); }
    catch (e) { err.textContent = e.message; }
    show();
  };
  const fromFile = async f => { if (!f) return; if (!/^image\//.test(f.type || 'image/')) { err.textContent = '画像のファイルを選んでください'; return; } take(await readFile(f)); };
  file.addEventListener('change', () => { fromFile(file.files[0]); file.value = ''; });
  PASTE = fromFile;
  show();
  const root = el('div', { class: 'pick' }, [
    pv,
    el('div', { class: 'row' }, [el('button', { class: 'go', text: '📷 写真から選ぶ', onclick: () => file.click() }), clear]),
    el('p', { class: 'hint', text: 'スマホは写真アプリから、パソコンはファイルから選べます。画像をコピーして Ctrl+V で貼りつけることもできます。' }),
    file, err
  ]);
  return {
    el: root,
    get: () => value,
    setShape: s => { shape = s; show(); },
    // 「読みこむ」で見つけた画像の住所 → サーバーで画像を取ってきて、写真と同じように小さくする
    async fromUrl(u) {
      if (!safeUrl(u)) return;
      try { await take(await call('portalFetchImage', CODE, u)); if (!value) value = u; }
      catch (e) { value = u; err.textContent = ''; }
      show();
    }
  };
}

async function loadSubs() {
  try { SUBS = await call('portalSubmissions', CODE); updateSubDot(); } catch (e) {}
}
function updateSubDot() {
  const d = $('subDot');
  if (!d) return;
  const n = SUBS ? SUBS.wait : 0;
  d.hidden = !n; d.textContent = n;
  $('subBtn').title = n ? 'まだ見ていない申請が ' + n + ' 件' : '申請';
}
const SUB_STATE = { '未確認': 'wait', '許可': 'ok', '見送り': 'no' };
function openSubs(filter) {
  openModal(box => {
    box.classList.add('wide');
    box.appendChild(el('h3', { text: '📮 ゲームの申請' }));
    const tabs = el('div', { class: 'sub-tabs' });
    const body = el('div', {}, [el('div', { class: 'loading', text: '読みこみ中…' })]);
    box.append(tabs, body, el('div', { class: 'row' }, [el('button', { text: 'とじる', onclick: closeModal })]));
    const draw = () => {
      tabs.innerHTML = ''; body.innerHTML = '';
      const all = SUBS.list;
      [['wait', 'まだ見ていない（' + SUBS.wait + '）'], ['ok', '許可した'], ['no', '見送った'], ['all', 'ぜんぶ（' + all.length + '）']].forEach(([k, t]) =>
        tabs.appendChild(el('button', { class: filter === k ? 'on' : '', text: t, onclick: () => { filter = k; draw(); } })));
      const list = all.filter(s => filter === 'all' || SUB_STATE[s.state] === filter);
      if (!list.length) body.appendChild(el('p', { class: 'empty-msg', text: filter === 'wait' ? 'まだ見ていない申請はありません' : 'ありません' }));
      list.forEach(s => body.appendChild(subCard(s, draw)));
    };
    const refresh = () => call('portalSubmissions', CODE).then(r => { SUBS = r; updateSubDot(); draw(); })
      .catch(e => { body.innerHTML = ''; body.appendChild(el('div', { class: 'err', text: e.message })); });
    if (SUBS) draw();
    refresh();
  });
}
function subCard(s, redraw) {
  const st = SUB_STATE[s.state] || 'wait';
  const kv = (k, v) => el('p', { class: 'kv' }, [el('span', { text: k + '：' }), v]);
  const link = u => safeUrl(u) ? el('a', { href: u, target: '_blank', rel: 'noopener noreferrer', text: u }) : '（なし）';
  const img = safeImg(s.image);
  const err = el('div', { class: 'err' });
  const c = el('div', { class: 'subm ' + st }, [
    img ? el('img', { src: img, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }) : null,
    el('h4', { text: s.title }),
    el('p', { class: 'kv' }, [el('span', { class: 'st ' + st, text: s.state }), ' ' + new Date(s.at).toLocaleString('ja-JP')]),
    kv('URL', link(s.url)),
    s.desc ? kv('説明', s.desc) : null,
    kv('作者', s.author),
    kv('作者のSNS', link(s.authorUrl)),
    kv('連絡先（ページには出しません）', s.contact || '（なし）'),
    s.memo ? kv('メモ', s.memo) : null,
    err
  ]);
  const done = async (p, msg) => {
    c.querySelectorAll('button').forEach(b => { b.disabled = true; });
    err.textContent = '';
    try { await p(); SUBS = await call('portalSubmissions', CODE); updateSubDot(); toast(msg); redraw(); if (msg !== '見送りました') load(true); }
    catch (e) { err.textContent = e.message; c.querySelectorAll('button').forEach(b => { b.disabled = false; }); }
  };
  if (st !== 'ok') {
    c.appendChild(el('div', { class: 'row' }, [
      el('button', { class: 'ok-btn', text: '✅ 許可', onclick: () => {
        if (confirm('「' + s.title + '」を「みんなのゲーム」に載せますか？')) done(() => call('portalApprove', CODE, s.id), '載せました');
      } }),
      el('button', { text: '✏️ 直して許可', onclick: () => openEditor(null, s) }),
      st === 'wait' ? el('button', { text: '❌ 見送り', onclick: () => {
        const memo = prompt('見送る理由のメモ（管理者だけが見ます。なくてもOK）', '');
        if (memo !== null) done(() => call('portalReject', CODE, s.id, memo), '見送りました');
      } }) : null
    ]));
  }
  return c;
}

function adminTools(it) {
  const stop = fn => e => { e.preventDefault(); e.stopPropagation(); fn(); };
  return el('div', { class: 'tools' }, [
    el('button', { title: '上へ', text: '↑', onclick: stop(() => move(it, -1)) }),
    el('button', { title: '下へ', text: '↓', onclick: stop(() => move(it, 1)) }),
    el('button', { title: '直す', text: '✏️', onclick: stop(() => openEditor(it)) }),
    el('button', { title: '消す', text: '🗑️', onclick: stop(() => remove(it)) })
  ]);
}

async function move(it, dir) {
  // 同じ種類の中でとなりと入れかえる（全部の並びのうち、同じ種類のとなりまで動かす）
  const same = DATA.items.filter(x => x.kind === it.kind);
  const i = same.indexOf(it), j = i + dir;
  if (j < 0 || j >= same.length) return;
  const steps = Math.abs(DATA.items.indexOf(same[j]) - DATA.items.indexOf(it));
  try {
    for (let n = 0; n < steps; n++) await call('portalMove', CODE, it.id, dir);
    await load(true);
  } catch (e) { toast(e.message); }
}

async function remove(it) {
  if (!confirm('「' + it.title + '」を一覧から消しますか？')) return;
  try { await call('portalRemove', CODE, it.id); await load(true); toast('消しました'); } catch (e) { toast(e.message); }
}

// 追加・直す画面。URL を貼って「読みこむ」→ 題名・画像が入る → 直して「登録」
// sub：申請（📮 の「✏️ 直して許可」）。そのときは申請の中身を入れて、保存で許可する
function openEditor(it, sub) {
  if (sub) it = { url: sub.url, kind: 'community', title: sub.title, desc: sub.desc, image: sub.image, author: sub.author, authorUrl: sub.authorUrl, pr: false, vid: '' };
  const isNewItem = !it || !!sub;
  openModal(box => {
    const f = {
      url: el('input', { type: 'url', placeholder: 'https://…', value: it ? it.url : '' }),
      kind: el('select', {}, ORDER.map(k => el('option', { value: k, text: KINDS[k].tab }))),
      title: el('input', { type: 'text', value: it ? it.title : '' }),
      desc: el('textarea', {}, it ? [it.desc] : []),
      author: el('input', { type: 'text', maxlength: '40', value: it ? it.author || '' : '' }),
      authorUrl: el('input', { type: 'url', placeholder: 'https://x.com/…', value: it ? it.authorUrl || '' : '' }),
      pr: el('input', { type: 'checkbox' })
    };
    let vid = it ? it.vid : '';
    f.kind.value = it ? it.kind : 'game';
    if (sub) f.kind.disabled = true;
    f.pr.checked = it ? !!it.pr : false;
    const pick = imagePicker(it ? it.image : '');
    const shapeOf = k => k === 'video' ? 'r34' : k === 'support' ? 'r11' : 'wide';
    pick.setShape(shapeOf(f.kind.value));
    const authorBox = el('div', {}, [
      el('label', { text: '作者名（みんなのゲーム）' }), f.author,
      el('label', { text: '作者のSNSのURL（なくてもOK）' }), f.authorUrl
    ]);
    const showAuthor = () => { authorBox.hidden = f.kind.value !== 'community'; };
    f.kind.addEventListener('change', () => { if (f.kind.value === 'pr') f.pr.checked = true; pick.setShape(shapeOf(f.kind.value)); showAuthor(); });
    showAuthor();
    const err = el('div', { class: 'err' });
    const detail = el('div', { hidden: it ? null : '' });

    const read = el('button', { class: 'btn go', text: '🔍 読みこむ', onclick: async () => {
      read.disabled = true; err.textContent = ''; read.textContent = '読みこみ中…';
      try {
        const p = await call('portalPreview', CODE, f.url.value);
        f.url.value = p.url; f.kind.value = p.kind; f.pr.checked = !!p.pr; vid = p.vid || '';
        if (p.title) f.title.value = p.title;
        if (p.desc) f.desc.value = p.desc;
        pick.setShape(shapeOf(f.kind.value));
        if (p.image && !pick.get()) await pick.fromUrl(p.image);
        if (p.note || !p.title) err.textContent = p.note || '題名が読めなかったので、手で入れてください';
      } catch (e) { err.textContent = e.message; }
      detail.hidden = false; read.disabled = false; read.textContent = '🔍 もう一度読みこむ';
    } });

    const save = el('button', { class: 'go', text: sub ? '✅ この中身で許可' : it ? '直す' : '登録する', onclick: async () => {
      save.disabled = true; err.textContent = '';
      const item = { url: f.url.value, kind: f.kind.value, title: f.title.value, desc: f.desc.value, image: pick.get(), pr: f.pr.checked, vid,
        author: f.author.value, authorUrl: f.authorUrl.value };
      try {
        if (sub) {
          await call('portalApprove', CODE, sub.id, item);
          SUBS = await call('portalSubmissions', CODE); updateSubDot();
          load(true); toast('直して載せました'); openSubs('wait');
          return;
        }
        if (!isNewItem) await call('portalUpdate', CODE, it.id, item); else await call('portalAdd', CODE, item);
        closeModal(); await load(true); toast(!isNewItem ? '直しました' : '登録しました');
      } catch (e) { err.textContent = e.message; save.disabled = false; }
    } });

    detail.append(
      el('label', { text: '種類' }), f.kind,
      el('label', { text: '題名' }), f.title,
      authorBox,
      el('label', { text: '説明' }), f.desc,
      el('label', { text: '画像' }), pick.el,
      el('label', { class: 'check' }, [f.pr, '「PR」をつける（広告・アフィリエイトのリンク）']),
      el('p', { class: 'hint', text: 'アフィリエイトのリンクは「PR」をつける決まりがあります（おすすめ はいつも PR がつきます）。' })
    );
    box.append(
      el('h3', { text: sub ? '✏️ 直して許可（みんなのゲーム）' : it ? '✏️ 直す' : '＋ URLを貼って追加' }),
      el('label', { text: 'URL' }), f.url,
      el('p', { class: 'hint', text: sub ? 'URL を開いて、中身を確かめてから載せてください。' : 'ゲーム・note・TikTok・アフィリエイト・応援のページなど。読みこむと題名と画像が自動で入ります。' }),
      ...(sub ? [] : [el('div', { class: 'row' }, [read])]),
      detail, err,
      el('div', { class: 'row' }, [el('button', { text: sub ? 'もどる' : 'やめる', onclick: sub ? () => openSubs('wait') : closeModal }), save])
    );
    if (!it) setTimeout(() => f.url.focus(), 50);
  });
}

// ---------------------------------------------------------------- 📊 集計の画面（管理者だけ）
const KIND_NAMES = { game: 'ゲーム', community: 'みんなのゲーム', video: '動画', note: 'note', pr: 'おすすめ', support: '応援', other: 'そのほか', link: '上のリンク' };
function openStats(days) {
  openModal(box => {
    box.classList.add('wide');
    box.appendChild(el('h3', { text: '📊 集計' }));
    const per = el('div', { class: 'periods' }, [[1, '今日（24時間）'], [7, '7日'], [30, '30日'], [0, 'ぜんぶ']].map(([d, t]) =>
      el('button', { class: d === days ? 'on' : '', text: t, onclick: () => openStats(d) })));
    const body = el('div', { class: 'st' }, [el('div', { class: 'loading', text: '集計しています…' })]);
    box.append(per, body, el('div', { class: 'row' }, [el('button', { text: 'とじる', onclick: closeModal })]));
    call('portalStats', CODE, days).then(s => { body.innerHTML = ''; statsView(body, s); if (days === 30) { STATS30 = s; } })
      .catch(e => { body.innerHTML = ''; body.appendChild(el('div', { class: 'err', text: e.message })); });
  });
}
function hbars(list, label) {
  const max = Math.max(1, ...list.map(x => x[1]));
  return list.map(([k, v]) => el('div', { class: 'hbar' }, [el('span', { class: 't', text: label ? label(k) : k }),
    el('div', { class: 'bar' }, [el('i', { style: 'width:' + (v * 100 / max) + '%' })]), el('b', { text: v })]));
}
function statsView(b, s) {
  const num = (n, t) => el('div', { class: 'num' }, [el('b', { text: n.toLocaleString() }), el('span', { text: t })]);
  b.appendChild(el('div', { class: 'nums' }, [num(s.people, '来た人'), num(s.newPeople, 'はじめての人'), num(s.views, '見た回数'), num(s.clicks, '押した回数')]));
  if (!s.views && !s.clicks) b.appendChild(el('p', { class: 'hint', text: 'まだ記録がありません。ページが見られると、ここに数が出ます（管理者の端末は数えません）。' }));

  if (s.days_.length > 1) {
    const max = Math.max(1, ...s.days_.map(d => d.people));
    b.append(el('h4', { text: '📅 日ごとの来た人' }),
      el('div', { class: 'cols' }, s.days_.slice(-30).map(d => el('div', { title: d.day + '：' + d.people + '人・押した' + d.clicks, style: 'height:' + (d.people * 100 / max) + '%' }))),
      el('div', { class: 'cols-lab' }, [el('span', { text: s.days_.slice(-30)[0].day.slice(5) }), el('span', { text: s.days_[s.days_.length - 1].day.slice(5) })]));
  }
  if (s.items.length) {
    b.appendChild(el('h4', { text: '🏆 よく押されたもの（押した人の割合＝来た人のうち何%が押したか）' }));
    b.appendChild(el('table', { class: 'rank' }, [
      el('tr', {}, ['', '題名', '種類', '押した', '人', '割合'].map(t => el('th', { text: t }))),
      ...s.items.slice(0, 20).map((it, i) => el('tr', {}, [el('td', { class: 'n', text: i + 1 }), el('td', { class: 't', text: it.title, title: it.title }),
        el('td', { text: KIND_NAMES[it.kind] || it.kind }), el('td', { class: 'n', text: it.clicks + it.video }), el('td', { class: 'n', text: it.people }), el('td', { class: 'n', text: it.rate + '%' })]))
    ]));
  }
  // 🕹️ みんなのゲーム：作者さんに「○回押されました」と伝える用（押されていないものも0回で出す）
  const cm = DATA.items.filter(it => it.kind === 'community');
  if (cm.length) {
    const cnt = id => { const x = s.items.find(i => i.id === id); return x ? x.clicks + x.video : 0; };
    const sns = id => { const x = s.items.find(i => i.id === 'author:' + id); return x ? x.clicks : 0; };
    b.appendChild(el('h4', { text: '🕹️ みんなのゲーム（作者さんに伝える用）' }));
    b.appendChild(el('table', { class: 'rank' }, [
      el('tr', {}, ['題名', '作者', '押された', 'SNSへ'].map(t => el('th', { text: t }))),
      ...cm.map(it => [it, cnt(it.id)]).sort((a, c) => c[1] - a[1]).map(([it, n]) => el('tr', {}, [
        el('td', { class: 't', text: it.title, title: it.title }), el('td', { class: 't', text: it.author || '' }),
        el('td', { class: 'n', text: n + '回' }), el('td', { class: 'n', text: sns(it.id) + '回' })]))
    ]));
    b.appendChild(el('p', { class: 'hint', text: '例：「' + (s.days ? 'この' + s.days + '日で' : 'これまでに') + '、あなたのゲームは ○回 押されました」と作者さんに伝えられます。' }));
  }
  if (s.kinds.length) b.append(el('h4', { text: '🗂️ 種類ごとのクリック' }), ...hbars(s.kinds, k => KIND_NAMES[k] || k));
  if (s.ref.length) b.append(el('h4', { text: '🚪 どこから来たか' }), ...hbars(s.ref));
  if (s.dev.length) b.append(el('h4', { text: '📱 端末' }), ...hbars(s.dev));
  if (s.app.length) b.append(el('h4', { text: '💬 アプリの中のブラウザで見た人' }), ...hbars(s.app));
  if (s.tabs.length) b.append(el('h4', { text: '🔖 よく見られたタブ' }), ...hbars(s.tabs, k => (KINDS[k] && KINDS[k].tab) || (k === 'all' ? 'すべて' : k)));
  if (s.views) {
    const max = Math.max(1, ...s.hours);
    b.append(el('h4', { text: '🕐 見られた時間（日本時間）' }),
      el('div', { class: 'cols' }, s.hours.map((n, h) => el('div', { title: h + '時：' + n + '回', style: 'height:' + (n * 100 / max) + '%' }))),
      el('div', { class: 'cols-lab' }, ['0時', '6時', '12時', '18時', '23時'].map(t => el('span', { text: t }))));
  }
  if (s.poll) {
    b.appendChild(el('h4', { text: '🗳️ アンケート：' + s.poll.q + '（' + s.poll.total + '人' + (s.poll.on ? '' : '・今はページに出していません') + '）' }));
    b.append(...hbars(s.poll.opts.map((o, i) => [o, s.poll.counts[i]])));
    if (s.poll.comments.length) {
      b.appendChild(el('h4', { text: '💬 ひとこと（新しい順）' }));
      s.poll.comments.forEach(c => b.appendChild(el('div', { class: 'cmt' }, [c.text, el('small', { text: c.choice + ' ・ ' + new Date(c.at).toLocaleString('ja-JP') })])));
    }
  }
  if (s.sheet) b.appendChild(el('a', { class: 'sheet-link', href: s.sheet, target: '_blank', rel: 'noopener', text: '📄 スプレッドシートで詳しく見る（「portal_集計」のシート）' }));
  if (s.sheetError) b.appendChild(el('div', { class: 'err', text: 'スプレッドシートに書けませんでした：' + s.sheetError }));
}

function openSettings() {
  // アンケートの今の中身（管理者の集計にあれば出していない物も）
  const pollNow = (STATS30 && STATS30.poll) || (DATA.poll ? Object.assign({ on: true }, DATA.poll) : {});
  const s = DATA.settings || {};
  openModal(box => {
    const f = {
      bio: el('textarea', {}, [s.bio || '']),
      noteUser: el('input', { type: 'text', value: s.noteUser || '', placeholder: '例：hamcheese' }),
      links: el('textarea', { placeholder: 'X https://x.com/…\nTikTok https://www.tiktok.com/@…' }, [(s.links || []).map(l => l.label + ' ' + l.url).join('\n')]),
      adsense: el('input', { type: 'text', value: s.adsense || '', placeholder: 'ca-pub-0000000000000000' }),
      pollQ: el('input', { type: 'text', value: pollNow.q || '', placeholder: '例：次に作ってほしいゲームは？' }),
      pollOpts: el('textarea', { placeholder: 'パズル\nRPG\n育てるゲーム\nアクション' }, [(pollNow.opts || []).join('\n')]),
      pollOn: el('input', { type: 'checkbox' })
    };
    f.pollOn.checked = !!pollNow.on;
    const err = el('div', { class: 'err' });
    const save = el('button', { class: 'go', text: '保存', onclick: async () => {
      save.disabled = true; err.textContent = '';
      const links = f.links.value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
        const m = l.match(/^(.*?)\s+(https?:\/\/\S+)$/); return m ? { label: m[1], url: m[2] } : null;
      }).filter(Boolean);
      try {
        // ページの名前とロゴは決まっている（SITE_NAME）。前に入れた名前・アイコンはそのまま残す
        await call('portalSaveSettings', CODE, { name: s.name || '', bio: f.bio.value, icon: s.icon || '', noteUser: f.noteUser.value, links, adsense: f.adsense.value });
        const pq = f.pollQ.value.trim(), po = f.pollOpts.value.split('\n').map(x => x.trim()).filter(Boolean);
        if (pq || pollNow.q) await call('portalSavePoll', CODE, { q: pq, opts: po, on: f.pollOn.checked });
        closeModal(); await load(true); toast('保存しました');
      } catch (e) { err.textContent = e.message; save.disabled = false; }
    } });
    box.append(
      el('h3', { text: '⚙️ ページの設定' }),
      el('label', { text: 'ひとこと（ロゴの下に出ます）' }), f.bio,
      el('label', { text: 'note のユーザー名' }), f.noteUser,
      el('p', { class: 'hint', text: 'note.com/○○ の ○○。入れると、新しい記事が自動で並びます（3時間ごとに読みなおし）。' }),
      el('label', { text: '上に出すリンク（1行に「名前 URL」）' }), f.links,
      el('label', { text: 'Google AdSense の ID（審査に通ってから）' }), f.adsense,
      el('label', { text: '🗳️ アンケートの質問' }), f.pollQ,
      el('label', { text: '選ぶもの（1行に1つ・2〜8こ）' }), f.pollOpts,
      el('label', { class: 'check' }, [f.pollOn, 'アンケートをページに出す']),
      el('p', { class: 'hint', text: '質問か選ぶものを変えると、新しいアンケートとして数えなおします（前の答えはスプレッドシートに残ります）。' }),
      err,
      el('div', { class: 'row' }, [el('button', { text: 'やめる', onclick: closeModal }), save])
    );
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeVideo(); } });
if (new URLSearchParams(location.search).has('admin') && !CODE) setTimeout(openLogin, 300);
track('view', null);
if (CODE) { loadStats30(); loadSubs(); }
load(false);
